[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quizbinf-backend"
version = "0.1.0"
description = "Backend for quizbinf, an in-class peer-instruction quiz app"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "sse-starlette>=2.1",
    "pydantic-settings>=2.4",
    "itsdangerous>=2.2",
    "psycopg[binary]>=3.2",
    # QR codes are rendered server-side as SVG: the projected code is the only
    # way students reach the app, so it must not depend on browser bundling.
    "qrcode>=8.0",
    # Question text is Markdown, rendered and sanitised server-side.
    "markdown-it-py>=3.0",
    "nh3>=0.2.18",
    # Multipart form parsing, for figure uploads.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the backend root on sys.path so `app.*` and the `tests.*` helpers import
# the same way under both `pytest` (console script) and `python -m pytest`.
# Without this, only the latter works, because it alone adds the cwd.
pythonpath = ["."]
