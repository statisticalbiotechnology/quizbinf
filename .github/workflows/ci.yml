name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Test round and answer rules
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        # Chromium ships with the ubuntu-latest runner image.
        run: CHROME_BIN=$(which chromium-browser || which chromium || which google-chrome) npx ng test --watch=false --karma-config=karma.conf.js
      - name: Production build
        working-directory: frontend
        run: npm run build -- --configuration production
